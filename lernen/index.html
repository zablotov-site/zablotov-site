<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספר דרך ה׳ – עם פירוש באידיש · Chevras Zablotov</title>
<style>@font-face{font-family:'Frank Ruhl Libre';font-weight:400;font-display:swap;src:url(/fonts/frl-hebrew-400.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Frank Ruhl Libre';font-weight:700;font-display:swap;src:url(/fonts/frl-hebrew-700.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Frank Ruhl Libre';font-weight:400;font-display:swap;src:url(/fonts/frl-latin-400.woff2) format('woff2')}
body{margin:0;background:#241a12;font-family:'Frank Ruhl Libre',Georgia,serif}
.bar{position:sticky;top:0;z-index:3;display:flex;gap:6px;align-items:center;background:#43101d;color:#f3ead3;padding:8px 10px;border-bottom:2px solid #b08a3e}
.bar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a,.bar button{color:#f3ead3;background:#0000;border:1px solid #b08a3e;border-radius:4px;padding:5px 9px;font-size:14px;text-decoration:none;font-family:inherit}
#pg{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 40px}
canvas{max-width:100%;background:#fff;box-shadow:0 2px 8px #0008}
.ld{color:#e9dcc0;padding:30px;text-align:center}
.ld a{color:#d9b45a}
#jump{width:70px;font-size:14px;padding:4px;border-radius:4px;border:0;font-family:inherit}</style></head><body>
<div class="bar"><a href="/sefarim">← Sforim</a><b>ספר דרך ה׳ – עם פירוש באידיש</b><input id="jump" type="number" min="1" placeholder="Page"><button id="zm">+</button><button id="zo">−</button><button id="bm">🔖 צייכן וואו איך האלט</button><a id="dl" href="/f/s/mwd6ktk9c7r9eawy78.pdf" download>⬇</a></div>
<div id="pg"><div class="ld">Loading… (a big sefer can take a few seconds)</div></div>
<script>
// Fallback: if the module below never runs or fails (old browser, blocked file), offer a direct link.
window.__lernOk = false;
setTimeout(function () {
  if (window.__lernOk) return;
  var qs = new URLSearchParams(location.search);
  var F = qs.get("f") || "s/mwd6ktk9c7r9eawy78.pdf";
  var ld = document.querySelector(".ld");
  if (ld) ld.innerHTML = 'דער לייענער האט זיך נישט געעפנט.<br><a href="/f/' + F + '">עפענען דעם ספר דירעקט ↗</a>';
}, 15000);
</script>
<script type="module">
let pdfjsLib;
try {
  pdfjsLib = await import("/vendor/pdf.min.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.mjs";
} catch (e) {
  pdfjsLib = null;
}
const qs=new URLSearchParams(location.search);const F=qs.get("f")||"s/mwd6ktk9c7r9eawy78.pdf";const T=qs.get("t")||"ספר";document.title=T+" · Chevras Zablotov";document.querySelector(".bar b").textContent=T;document.querySelector(".bar a[download]").href="/f/"+F+"?dl=1";const key = "lern:" + F; const bmKey = "zbbm:" + F;
let scale = parseFloat(localStorage.getItem("lernZoom") || "1");
const box = document.getElementById("pg");
function fail(msg) {
  box.innerHTML = '<div class="ld">' + msg + '<br><a href="/f/' + F + '">עפענען דעם ספר דירעקט ↗</a></div>';
}
if (!pdfjsLib) {
  fail("דער לייענער האט זיך נישט געלאדנט.");
} else {
let doc;
try {
  doc = await pdfjsLib.getDocument({ url: "/f/"+F, disableAutoFetch: true, disableStream: false }).promise;
  window.__lernOk = true;
} catch (e) {
  fail("דער ספר האט זיך נישט געלאדנט — פּרובירט נאכאַמאָל.");
}
if (doc) {
box.innerHTML = "";
const holders = [];
for (let i = 1; i <= doc.numPages; i++) { const d = document.createElement("div"); d.dataset.p = i; d.style.minHeight = "60vh"; d.style.width = "100%"; d.style.display = "flex"; d.style.justifyContent = "center"; box.appendChild(d); holders.push(d); }
const done = new Set();
async function render(d) { const i = +d.dataset.p; if (done.has(i)) return; done.add(i);
  try {
  const page = await doc.getPage(i); const w = Math.min(window.innerWidth - 8, 900) * scale;
  const vp0 = page.getViewport({ scale: 1 }); const vp = page.getViewport({ scale: (w / vp0.width) * (window.devicePixelRatio || 1) });
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; c.style.width = w + "px";
  await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise; d.style.minHeight = ""; d.innerHTML = ""; d.appendChild(c);
  } catch (e) { done.delete(i); }
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { render(e.target); localStorage.setItem(key, e.target.dataset.p); } }), { rootMargin: "800px" });
holders.forEach(h => io.observe(h));
const wantP = +qs.get("p") || 0;
const last = (wantP >= 1 && wantP <= doc.numPages) ? wantP : (+localStorage.getItem(key) || 1);
if (last > 1) {
  const target = holders[last - 1];
  const anchor = () => { target.scrollIntoView(); window.scrollBy(0, -56); };
  anchor();
  // pages above render lazily and grow, shifting the target down; re-anchor until layout settles
  let lastTop = -1, stable = 0;
  const iv = setInterval(() => {
    if (target.offsetTop !== lastTop) { lastTop = target.offsetTop; anchor(); stable = 0; }
    else if (++stable > 4) clearInterval(iv);
  }, 300);
  setTimeout(() => clearInterval(iv), 12000);
}
const bmBtn = document.getElementById("bm");
bmBtn.onclick = () => {
  const y = window.scrollY + 120;
  let p = 1;
  for (const h of holders) { if (h.offsetTop <= y) p = +h.dataset.p; else break; }
  localStorage.setItem(bmKey, JSON.stringify({ p, t: T, at: Date.now() }));
  bmBtn.textContent = "✓ אויפגעהיט בלאט " + p;
  setTimeout(() => { bmBtn.textContent = "🔖 צייכן וואו איך האלט"; }, 1800);
};
document.getElementById("jump").onchange = e => { const n = +e.target.value; if (n >= 1 && n <= doc.numPages) holders[n - 1].scrollIntoView(); };
const rezoom = z => { localStorage.setItem("lernZoom", z); location.reload(); };
document.getElementById("zm").onclick = () => rezoom(Math.min(2.5, scale + 0.25));
document.getElementById("zo").onclick = () => rezoom(Math.max(0.5, scale - 0.25));
} }
</script></body></html>
