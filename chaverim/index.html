  <p class="small muted center">מען ווערט צוגעלייגט ווען מען גייט אריין אין <a href="/chat">צ׳אט</a> מיט א נאמען (און א בילד אין פראפיל).</p></main>
<script>
(function(){
var COLORS=["#3fb2ae","#a3177a","#4c1769","#e07a2f","#2f7de0","#23807d","#c0392b","#8e44ad"];
var col=function(s){return COLORS[[...String(s||"")].reduce(function(a,c){return a+c.charCodeAt(0)},0)%COLORS.length]};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function heb(ts,cb){var d=new Date(ts);fetch("https://www.hebcal.com/converter?cfg=json&gy="+d.getFullYear()+"&gm="+(d.getMonth()+1)+"&gd="+d.getDate()+"&g2h=1").then(function(r){return r.json()}).then(function(j){cb(j.hebrew||"")}).catch(function(){cb("")})}
fetch("/api/chat?chaverim=1").then(function(r){return r.json()}).then(function(j){
  var ppl=j.people||[];
  document.getElementById("chlead").textContent=ppl.length+" חברים אין דער חבורה צ׳אט.";
  var box=document.getElementById("chmem");
  box.innerHTML=ppl.map(function(p){
    var init=[...String(p.name||"?")][0]||"?";
    var style="background-color:"+col(p.who||p.name)+(p.av?";background-image:url(/f/"+p.av+")":"");
    return '<div class="mem-c"><span class="mem-av" style="'+style+'">'+(p.av?"":esc(init))+(p.online?'<span class="on"></span>':"")+'</span><b>'+esc(p.name||"?")+'</b><span class="small muted" data-ts="'+(p.since||p.at||0)+'"></span></div>';
  }).join("");
  box.querySelectorAll("[data-ts]").forEach(function(el){var ts=+el.getAttribute("data-ts");if(ts)heb(ts,function(h){el.textContent=h})});
}).catch(function(){document.getElementById("chlead").textContent="נישט געלונגען צו לאדנען."});
})();
</script>

<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
(()=>{const st=matchMedia("(display-mode: standalone)").matches||navigator.standalone;if(st||localStorage.getItem("insX")||location.pathname.startsWith("/admin")||location.pathname==="/lernen")return;
const ins=document.getElementById("ins"),b=document.getElementById("insB"),t=document.getElementById("insT");let ev=null;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;ins.hidden=false});
if(ios){t.innerHTML="Tap <b>⬆️ Share</b>, then <b>“Add to Home Screen”</b>";b.hidden=true;setTimeout(()=>ins.hidden=false,1500)}
b.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ins.hidden=true};
document.getElementById("insX").onclick=()=>{ins.hidden=true;localStorage.setItem("insX","1")};})();
</script>
